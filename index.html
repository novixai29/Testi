<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Med Tutorial</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="container">

  <!-- Header -->
  <header>
    <h1>Med Tutorial</h1>
    <button onclick="toggleMode()" id="modeBtn">🌙</button>
  </header>

  <!-- Welcome -->
  <div class="welcome">
    السلام عليكم، هذا الموقع مجاني كصدقة جارية لأرواح اموات المسلمين جميعاً
  </div>

  <!-- Student Info -->
  <div id="studentBox" class="card">
    <h2>أدخل بياناتك</h2>
    <input id="name" placeholder="اسم الطالب">
    <input id="college" placeholder="اسم الكلية">
    <button onclick="saveStudent()">دخول</button>
  </div>

  <!-- Main App -->
  <div id="app" style="display:none;">

    <!-- Upload Lecture -->
    <div class="card">
      <h2>رفع المحاضرة</h2>
      <input type="file" id="fileInput">
      <button onclick="uploadLecture()">رفع وشرح</button>
    </div>

    <!-- Processing -->
    <div id="loading" class="loading">
      <p>المسألة ما تطول، اذكر الله علما نكمل</p>
      <div class="zekr">
        <p>📿 العلم نور، ومن طلب العلم رفعه الله</p>
        <p>📿 اللهم زدنا علماً نافعاً</p>
        <p>📿 العلم حياة القلوب</p>
      </div>
    </div>

    <!-- Lecture Output -->
    <div id="output" class="card"></div>

    <!-- Tabs -->
    <div class="tabs">
      <button onclick="showTab('terms')">المصطلحات</button>
      <button onclick="showTab('quiz')">الاختبارات</button>
      <button onclick="showTab('history')">السجل</button>
    </div>

    <div id="terms" class="card tab"></div>
    <div id="quiz" class="card tab"></div>
    <div id="history" class="card tab"></div>

  </div>

</div>

<script src="script.js"></script>
</body>
</html>
